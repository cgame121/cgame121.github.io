<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="หุบเขาขุดแร่">
<meta name="theme-color" content="#16110d">
<title>หุบเขาขุดแร่</title>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Noto+Sans+Thai:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#cdbf9f;--fg:#2a2118;--ink:#16110d;--pn:rgba(22,16,11,.8);--brass:#d2a94f;--brass2:#7d5f24;--parch:#f1e6c6;--hp:#d9443f;--st:#4fbf5a;--coin:#ffd23f;--hd:'Mitr','Noto Sans Thai','Leelawadee UI',Tahoma,sans-serif;--bd:'Noto Sans Thai','Leelawadee UI',Tahoma,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0b09;--fg:#e9dfc4}}
:root[data-theme="dark"]{--bg:#0d0b09;--fg:#e9dfc4}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--fg);font-family:var(--bd);padding:0;user-select:none;-webkit-user-select:none;touch-action:none}
#frame{width:100%;height:100%;display:flex;flex-direction:column;background:var(--ink);padding:6px}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#wrap{position:relative;container-type:size;width:640px;max-width:100%;flex:none;border:2px solid var(--brass2);background:#000}
canvas#c{width:100%;height:100%;display:block;image-rendering:pixelated}
#hud{position:absolute;inset:0;pointer-events:none;font-size:max(9px,min(1.5cqw,2.14cqh));color:var(--parch);font-family:var(--bd)}
.pn{background:var(--pn);border:1px solid var(--brass2);box-shadow:inset 0 0 0 1px #0008,inset 0 1px 0 #d2a94f33;border-radius:4px}
#pl{position:absolute;left:1.2em;top:1.2em;display:flex;gap:.6em;padding:.5em;width:17em}
#av{width:3.6em;height:3.6em;image-rendering:pixelated;border:2px solid var(--brass);border-radius:50%;background:#2b3a55;flex:none}
.bars{flex:1;min-width:0}.nm{display:flex;justify-content:space-between;font-family:var(--hd);margin-bottom:.25em}.nm em{font-style:normal;color:var(--brass);font-size:.9em}
.bar{position:relative;height:1.25em;background:#0009;border:1px solid #000;margin-top:.25em;border-radius:2px;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;width:100%;transition:width .15s}
.bar span{position:relative;display:block;text-align:center;font-size:.85em;line-height:1.25em;text-shadow:0 1px 2px #000}
.hp i{background:linear-gradient(#f0605a,#a82a27)}.st i{background:linear-gradient(#6bd876,#2f8f3a)}.qb{height:.55em}.qb i{background:linear-gradient(#ffd96a,#c8922a);width:0}
#ct{position:absolute;left:50%;top:1.2em;transform:translateX(-50%);padding:.4em 1.1em;text-align:center;line-height:1.35;white-space:nowrap}
#ct b{display:block;font-family:var(--hd);font-weight:500;font-size:1.1em;color:var(--brass)}#ct u{text-decoration:none;color:var(--coin)}
#rt{position:absolute;right:1.2em;top:1.2em;display:flex;flex-direction:column;align-items:flex-end;gap:.5em}
#cn{display:flex;align-items:center;gap:.5em;padding:.3em .9em;font-family:var(--hd)}#g{font-weight:500;color:var(--coin);font-size:1.15em}
.coin{width:1.2em;height:1.2em;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3a0,#e0a91c 60%,#8a5d0b);border:1px solid #6a4608}
#mm{width:11em;height:7.7em;image-rendering:pixelated;padding:2px}
#qp{position:absolute;left:1.2em;top:7.2em;width:14em;padding:.5em .6em;opacity:.92}
#qp small{color:var(--brass);font-family:var(--hd)}#qt{margin:.2em 0;line-height:1.3}#crew{margin-top:.4em;font-size:.85em;color:#bfb394}
#log{position:absolute;left:1.2em;bottom:1em;width:min(60%,26em);display:flex;flex-direction:column;gap:2px}
#log div{background:#000a;padding:.15em .6em;border-left:3px solid var(--brass);border-radius:2px;transition:opacity 1s}#log div.old{opacity:0}
#pad{flex:none;width:min(100%,900px);margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 2px 2px}
#dp{display:grid;grid-template-columns:repeat(3,clamp(34px,10vw,44px));grid-template-rows:repeat(3,clamp(34px,10vw,44px));gap:3px}
button{font-family:var(--hd);touch-action:none}
#A{width:clamp(56px,16vw,74px);height:clamp(56px,16vw,74px);border-radius:50%;background:radial-gradient(circle at 35% 30%,#f2cd72,#b07d1f 70%);border:3px solid #5b3f0e;color:#2a1a04;font-size:17px;font-weight:600;line-height:1.1;box-shadow:0 4px 0 #3d2a08}
#A:active{transform:translateY(3px);box-shadow:0 1px 0 #3d2a08}
#fs{pointer-events:auto;font:500 1em var(--hd);padding:.35em .9em;border-radius:4px;background:var(--pn);color:var(--parch);border:1px solid var(--brass2)}
@media(max-height:480px) and (orientation:landscape){#frame{padding:2px}}
#hlp,#snd,#ex{pointer-events:auto;font:500 1em var(--hd);padding:.35em .9em;border-radius:4px;background:var(--pn);color:var(--parch);border:1px solid var(--brass2)}
button:focus-visible{outline:3px solid #4aa3ff}
#frame,#frame:fullscreen{padding:0}#wrap{border:0}#frame{position:fixed;inset:0;height:auto}
#pad{position:fixed;left:0;right:0;bottom:env(safe-area-inset-bottom,0px);width:auto;max-width:none;margin:0;padding:10px 16px;pointer-events:none;z-index:5}
#dp,#A{pointer-events:auto;opacity:.6}
@media(hover:hover) and (pointer:fine){#pad{display:none}}
#bld{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#000a;pointer-events:auto;font-size:max(10px,min(1.5cqw,2.14cqh));color:var(--parch);z-index:3}#bld[hidden]{display:none}
.bp2{width:30em;max-width:96%;max-height:96%;overflow:auto;padding:.9em;background:linear-gradient(#2a2014,#16110d);border:2px solid var(--brass)}
.bp2 .bh{display:flex;justify-content:space-between;align-items:center;font:500 1.35em var(--hd);color:var(--brass);margin-bottom:.4em}
.bp2 .bh button{font:500 .7em var(--hd);padding:.25em .8em;border-radius:4px;background:#3a2c18;color:var(--parch);border:1px solid var(--brass2)}
.bp2 p{color:#d9cfae;line-height:1.5;margin-bottom:.6em}
.rw{display:flex;justify-content:space-between;padding:.35em .6em;margin-bottom:.25em;background:#0b0805aa;border-left:3px solid var(--brass2);border-radius:3px}
.rw.ok{border-color:#4fbf5a}.rw.ok b{color:#7fe08a}.rw.no{border-color:var(--hp)}.rw.no b{color:#ff8a80}
.pb{height:.9em;background:#0009;border:1px solid #000;border-radius:3px;overflow:hidden;margin:.4em 0}.pb i{display:block;height:100%;background:linear-gradient(#ffd96a,#c8922a)}
.ac{display:block;width:100%;margin-top:.5em;padding:.6em;font:500 1.1em var(--hd);border-radius:6px;background:linear-gradient(#f2cd72,#b07d1f);color:#2a1a04;border:2px solid #5b3f0e}.ac:disabled{filter:grayscale(1) brightness(.55)}
.wh{display:block;color:#ff8a80;margin-top:.15em}
.bp2{touch-action:pan-y;overscroll-behavior:contain}
body:has(#bld:not([hidden])) #pad{display:none}
#hlp{padding:.35em .6em}.ib{display:flex;gap:.4em}
#ab{position:absolute;left:50%;top:5.5em;transform:translateX(-50%);padding:.5em 1.2em;text-align:center;z-index:4;pointer-events:none;border-color:var(--coin);animation:abin .4s ease-out}
#ab b{display:block;color:var(--coin);font-family:var(--hd);font-weight:500}
@keyframes abin{from{opacity:0;transform:translate(-50%,-1em)}}
.xpb{height:.45em!important}.xpb i{background:linear-gradient(#8fd0ff,#3a82c4)!important}
#log{width:min(calc(50% - 7em),26em)}
#abs{position:absolute;left:50%;top:5.5em;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:.4em;z-index:4;pointer-events:none}
#abs #ab{position:static;transform:none;animation:abin2 .4s ease-out;white-space:nowrap}
@keyframes abin2{from{opacity:0;margin-top:-1em}}
/* HUD layout: stacked columns instead of free-floating panels */
#lc{position:absolute;left:1.2em;top:1.2em;width:17em;display:flex;flex-direction:column;gap:.6em;pointer-events:none}
#lc #pl,#lc #qp{position:static;width:auto;left:auto;top:auto}
#lc #qp{opacity:.95}
#rt{width:11em;align-items:stretch;gap:.45em}
#rt #cn{justify-content:center}#rt #mm{width:100%;height:auto;aspect-ratio:10/7}
#rt .ib button{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#rt #rt .ib{display:grid;grid-template-columns:1fr 1fr 1fr}#rt .ib button{padding:.35em 0;text-align:center}
#ct{font-size:.95em}
@container (max-width:560px){
 #lc{width:13em;gap:.4em}#lc #qp #crew,#lc #qp small,#lc #qp .bar{display:none}#lc #qp{padding:.3em .5em}#lc #qt{margin:0}#lc #pl{padding:.35em;gap:.4em}#av{width:2.6em;height:2.6em}
 #rt{width:8em}#rt #mm{display:none}#ct{font-size:.8em;padding:.3em .7em}#ct b{font-size:1em}
}
/* HUD display modes: 0 full, 1 compact, 2 bars only */
body.hud1 #lc #qp,body.hud1 #rt #mm,body.hud2 #lc #qp,body.hud2 #rt #mm{display:none}
body.hud2 #ct,body.hud2 #lc #av,body.hud2 #lc .nm,body.hud2 #lc .xpb,body.hud2 #rt #cn{display:none}
body.hud2 #lc #pl{width:11em;padding:.3em .4em;background:#16110d99}body.hud2 #lc{width:11em}
#rt .ib{grid-template-columns:repeat(4,1fr)}
#rt .ib{grid-template-columns:repeat(3,1fr)}#rt .ib button{padding:.35em 0}
#ex[hidden]{display:none}#rt #ex{white-space:nowrap}

/* ===== UI refresh: lantern-lit stone & brass ===== */
:root{--r:10px;--line:rgba(210,169,79,.42);--glass:linear-gradient(180deg,rgba(44,33,21,.88),rgba(17,12,8,.88));--lift:0 4px 14px #0009,inset 0 1px 0 rgba(255,225,150,.14)}
.pn{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--lift);}
#wrap::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 48px rgba(0,0,0,.4)}
#pl{padding:.5em .6em;align-items:center}
#av{border:2px solid var(--brass);box-shadow:0 0 0 2px #0008,0 0 10px rgba(210,169,79,.45)}
.nm b{font-weight:500;letter-spacing:.02em}.nm em{background:#0007;border:1px solid var(--line);border-radius:99px;padding:0 .6em}
.bar{border-radius:99px;border:1px solid #000a;box-shadow:inset 0 1px 3px #000}.bar i{border-radius:99px}
.bar.hp span::before{content:"♥ ";color:#ffc2bd}
.xpb{margin-top:.35em}
#ct{border-radius:99px;padding:.35em 1.4em}#ct b{letter-spacing:.04em}
#cn{border-radius:99px;padding:.3em 1em;box-shadow:var(--lift)}#g{letter-spacing:.03em}
#mm{border-radius:var(--r);padding:3px}
#rt button,#hlp,#snd,#ex,#fs,#hv{background:var(--glass);border:1px solid var(--line);border-radius:8px;box-shadow:var(--lift);color:var(--parch);transition:filter .12s,transform .12s}
#rt button:hover{filter:brightness(1.2)}#rt button:active{transform:translateY(1px) scale(.97)}
#qp{border-left:3px solid var(--brass)}#qp small{letter-spacing:.06em}
#qp .bar.qb{height:.5em}
#log div{background:linear-gradient(90deg,#000b,#0000);border-left:3px solid var(--brass);border-radius:3px 0 0 3px;padding:.2em .8em .2em .6em}
#ab{border-radius:99px;padding:.4em 1.4em;box-shadow:0 0 16px rgba(255,210,63,.3),var(--lift)}
/* overlays: buildings, bag, character */
#bld{}
#bld{background:radial-gradient(ellipse at center,#000a,#000d)}
.bp2{background:linear-gradient(180deg,#2c2115,#150f0a);border:1px solid var(--brass);border-radius:14px;box-shadow:0 10px 34px #000c,inset 0 0 0 1px #0008,inset 0 1px 0 #ffe29a30;scrollbar-width:thin;scrollbar-color:var(--brass2) transparent}
.bp2 .bh{padding-bottom:.5em;margin-bottom:.7em;border-bottom:1px solid var(--line);letter-spacing:.02em}
.bp2 .bh button{border-radius:99px;padding:.3em 1em;background:#0006;border:1px solid var(--line)}
.bp2 .bh button:hover{background:var(--brass2)}
.bp2 p{color:#cfc5a5}
.rw{border-radius:7px;background:linear-gradient(90deg,#000a,#0005);padding:.45em .8em}
.rw b{font-family:var(--hd);font-weight:500}
.pb{border-radius:99px;height:.8em}.pb i{border-radius:99px}
.ac{border-radius:10px;border:1px solid #5b3f0e;background:linear-gradient(#f6d684,#c28a22 55%,#a8731a);color:#2a1a04;box-shadow:0 3px 0 #4a320a,0 6px 12px #0006;font-weight:500;transition:transform .1s,filter .12s}
.ac:hover:not(:disabled){filter:brightness(1.1)}
.ac:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #4a320a}
.ac:disabled{box-shadow:none}
.wh{font-size:.85em}
/* touch controls */
#dp,#A{opacity:.78}
#A{border:2px solid #6b4a10;box-shadow:0 0 0 5px rgba(210,169,79,.22),0 5px 0 #3d2a08,0 8px 14px #0008;letter-spacing:.02em}
#A:active{box-shadow:0 0 0 5px rgba(210,169,79,.35),0 1px 0 #3d2a08}


/* ===== worker camp ===== */
.wcamp h5{font:500 1.05em var(--hd);color:var(--brass);margin:.9em 0 .3em;padding-bottom:.25em;border-bottom:1px solid var(--line)}
.wsum{display:flex;gap:.4em;margin-bottom:.5em}.wsum span{background:#0007;border:1px solid var(--line);border-radius:99px;padding:.15em .8em;font-family:var(--hd);color:var(--parch)}
.wc{display:flex;gap:.6em;align-items:center;padding:.4em .5em;margin-bottom:.3em;background:linear-gradient(90deg,#000a,#0004);border-radius:8px;border:1px solid #3a2c18}
.av2{flex:none;width:2.4em;height:2.4em;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 30%,#f0b955,#c9722b);border:2px solid #7d5f24;font-size:1.1em}
.wi{flex:1;min-width:0}.wn{display:flex;justify-content:space-between;gap:.5em}.wn b{font-family:var(--hd);font-weight:500}.ws{color:#bfb394;font-size:.9em;white-space:nowrap}
.wb{height:.45em;margin-top:.3em;border-radius:99px;background:#0009;overflow:hidden}.wb i{display:block;height:100%;width:0;background:linear-gradient(#ffd96a,#c8922a);transition:width .25s linear}
.wu{padding:.5em .6em;margin-bottom:.4em;background:#0b0805aa;border:1px solid #3a2c18;border-radius:8px}
.wh2{display:flex;justify-content:space-between;align-items:center;font-family:var(--hd)}.wu small{display:block;color:#bfb394;margin:.15em 0 .35em}
.pips{display:flex;gap:.25em}.pips i{width:.9em;height:.9em;border-radius:3px;background:#0009;border:1px solid var(--brass2)}.pips i.on{background:linear-gradient(#ffd96a,#c8922a);border-color:#ffe08a}
.wu .mx{color:#7fe08a;font-family:var(--hd)}

.wc .ac{width:auto;flex:none;padding:.3em .9em;margin:0}.farm .tabs{margin-bottom:.5em}.farm h5{font:500 1.05em var(--hd);color:var(--brass);margin:.9em 0 .3em;padding-bottom:.25em;border-bottom:1px solid var(--line)}

/* ===== จอยสติ๊ก 360° ===== */
#dp{display:block;position:relative;width:clamp(104px,30vw,134px);height:clamp(104px,30vw,134px);border-radius:50%;touch-action:none;user-select:none;-webkit-user-select:none;
 background:radial-gradient(circle,#2e2316 0,#17110a 62%,#0c0905 100%);border:2px solid var(--brass2);box-shadow:inset 0 0 16px #000,0 4px 10px #0008,0 0 0 4px rgba(210,169,79,.12)}
#dp::before{content:"";position:absolute;inset:14%;border-radius:50%;border:1px dashed rgba(210,169,79,.28)}
#dp::after{content:"▲\A◀   ▶\A▼";white-space:pre;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:9px;line-height:2.3;color:rgba(210,169,79,.35);pointer-events:none;letter-spacing:.4em}
#jk{position:absolute;left:50%;top:50%;width:42%;height:42%;margin:-21% 0 0 -21%;border-radius:50%;pointer-events:none;
 background:radial-gradient(circle at 35% 30%,#f2cd72,#b07d1f 72%);border:2px solid #5b3f0e;box-shadow:0 3px 6px #000a,inset 0 1px 0 #fff6;transition:transform .08s}
#dp.on #jk{transition:none}

#clk{position:absolute;top:3.7em;left:50%;transform:translateX(-50%);display:flex;gap:.7em;align-items:center;padding:.25em 1em;border-radius:99px;font-size:.92em;white-space:nowrap;pointer-events:none}
#clk b{font-family:var(--hd);font-weight:500;color:var(--coin)}#clk span{color:var(--parch)}#clk em{font-style:normal;color:#cfc5a5;border-left:1px solid var(--line);padding-left:.7em}

/* ===== กระเป๋า ===== */
.bgt{display:flex;gap:.3em;flex-wrap:wrap;margin:.2em 0 .5em}.bgt button{padding:.2em .8em;border-radius:99px;background:#0006;border:1px solid var(--brass2);color:var(--parch);font-size:.95em}.bgt button.on{background:var(--brass2);color:#fff}
.bgg{display:grid;grid-template-columns:repeat(auto-fill,minmax(4.2em,1fr));gap:.35em;margin-bottom:.6em}
.bgs{position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:1.7em;border-radius:8px;background:#0008;border:1px solid #3a2c18;color:inherit;padding:0}
.bgs.on{border-color:var(--coin);box-shadow:0 0 0 2px #ffd23f55}.bgs.e{opacity:.35}
.bgs b{position:absolute;right:.2em;bottom:.05em;font:500 .5em var(--hd);color:var(--coin);text-shadow:0 1px 2px #000}
.bgd{padding:.6em .8em;border-radius:8px;background:#0b0805cc;border:1px solid #3a2c18;margin-bottom:.5em}.bgd small{color:#bfb394}
.bgr{display:flex;gap:.4em}.bgr .ac{margin-top:.4em}

/* ===== เมนูด้านล่าง ===== */
#dock{position:absolute;left:50%;bottom:.9em;transform:translateX(-50%);z-index:4;max-width:96%;display:flex;align-items:stretch;gap:.3em;padding:.3em .4em;font-size:max(11px,min(1.5cqw,2.14cqh));border-radius:1.8em;pointer-events:auto;background:var(--glass);border:1px solid var(--line);box-shadow:0 8px 22px #000b,inset 0 1px 0 rgba(255,225,150,.18);}
#dock button{order:5;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.05em;min-width:3.9em;min-height:3em;padding:.25em .55em;font:500 1.5em/1.1 var(--hd);color:var(--parch);background:transparent;border:1px solid transparent;border-radius:1.2em;box-shadow:none;pointer-events:auto;cursor:pointer;transition:background .15s,border-color .15s,transform .1s}
#dock button[hidden]{display:none}
#dock button::after{font:500 .45em/1 var(--hd);color:#bfb394;letter-spacing:.03em;white-space:nowrap}
#dock button:hover{background:linear-gradient(180deg,rgba(210,169,79,.28),rgba(125,95,36,.28));border-color:var(--line)}
#dock button:hover::after{color:var(--coin)}
#dock button:active{transform:scale(.94)}
#bgb{order:1}#snd{order:2}#hv{order:3}#fs{order:4}#hlp{order:5}#ex{order:6}
#bgb::after{content:"กระเป๋า"}#snd::after{content:"เสียง"}#hv::after{content:"HUD"}#fs::after{content:"เต็มจอ"}#hlp::after{content:"วิธีเล่น"}#ex::after{content:"ออกเหมือง"}
#ex{margin-left:.25em;background:linear-gradient(180deg,rgba(217,68,63,.3),rgba(120,30,28,.3))!important;border-color:rgba(255,140,130,.45)!important}
#ex::before{content:"";position:absolute;left:-.3em;top:22%;bottom:22%;width:1px;background:var(--line)}
#log{bottom:5.4em}
body:has(#bld:not([hidden])) #dock{display:none}

/* ===== เมนูแบบย่อ (ไม่รกจอ) ===== */
#dock{bottom:.5em;padding:.15em;gap:.15em;border-radius:1.6em;background:rgba(20,14,8,.5);box-shadow:0 4px 12px #0008;opacity:.6;transition:opacity .2s}
#dock.open,#dock:hover{opacity:1;background:var(--glass)}
#dock button{min-width:2.3em;min-height:2.3em;padding:.1em .3em;font-size:1.25em;border-radius:50%}
#dock button::after{display:none!important}
#dock:not(.open) button:not(#mt):not(#ex){display:none}
#dock #mt{order:9;font-size:1.1em;color:var(--brass)}
#dock #ex{border-radius:1.2em;font-size:1.05em;margin-left:0}
#dock #ex::before{display:none}
#log{bottom:3.6em}
#dock #zi,#dock #zo{order:1;font-size:1.5em;line-height:1}

const FT_={i:Math.round(6*ECON.smelt),s:Math.round(12*ECON.smelt),g:Math.round(20*ECON.smelt)},FK={i:'bi',s:'bs',g:'bg'},FO={i:'แร่เหล็ก',s:'แร่เงิน',g:'แร่ทอง'},FN={i:'แท่งเหล็ก',s:'แท่งเงิน',g:'แท่งทองคำ'},FUP=[0,0,ECON.g(400),ECON.g(1200),ECON.g(3500)];
